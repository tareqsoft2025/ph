name: photosync_telegram
description: إرسال صور الاستديو إلى بوت Telegram يدويًا أو تلقائيًا.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.2.0
  image_picker: ^1.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
