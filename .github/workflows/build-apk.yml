name: Build Flutter APK

on:
  push:
    branches: [main, claude/funny-gauss-3qf2tw]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.photosync --project-name photosync_telegram .

      - name: Patch permissions and Gradle settings
        run: python3 tool/patch_android.py

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk photosync-telegram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: photosync-telegram-apk
          path: flutter_app/photosync-telegram.apk

      # رابط تنزيل مباشر ثابت:
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/photosync-telegram.apk
      - name: Publish to the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk photosync-telegram.apk \
            --title "PhotoSync Telegram (latest build)" \
            --notes "Automated build of commit ${GITHUB_SHA}. Debug-signed APK: allow install from unknown sources." \
            --prerelease --target "${GITHUB_SHA}"
